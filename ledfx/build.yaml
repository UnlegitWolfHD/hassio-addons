---
# Basis-Images pro Architektur. Es wird bewusst KEIN homeassistant/*-base-Image
# verwendet, sondern direkt das offizielle LedFx-Image (deshalb init: false).
#
# Geprueft am 2026-09-12: ghcr.io/ledfx/ledfx:latest ist ein Manifest-List mit
# linux/amd64 + linux/arm64 (Debian trixie, Python 3.12) und zeigt aktuell auf
# denselben Digest wie der Tag 2.1.9.
#
# Reproduzierbare Builds: statt :latest eine Version pinnen, z. B.
#   aarch64: ghcr.io/ledfx/ledfx:2.1.9        (ohne "v"-Praefix!)
# Alternative Registry (Spiegel, aber mit Docker-Hub-Pull-Limits):
#   aarch64: ledfxorg/ledfx:latest
build_from:
  aarch64: ghcr.io/ledfx/ledfx:latest
  amd64: ghcr.io/ledfx/ledfx:latest

labels:
  org.opencontainers.image.title: "LedFx Home Assistant Add-on"
  org.opencontainers.image.description: "Audio-reactive LED-Steuerung fuer WLED & Co."
  org.opencontainers.image.source: "https://github.com/DEIN-GITHUB-USER/ha-ledfx-addon"
  org.opencontainers.image.licenses: "MIT"

args: {}
