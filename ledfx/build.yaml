---
# Basis-Images pro Architektur. Es wird bewusst KEIN homeassistant/*-base-Image
# verwendet, sondern direkt das offizielle LedFx-Image (deshalb init: false).
#
# Geprueft am 2026-09-12: ghcr.io/ledfx/ledfx:latest ist ein Manifest-List mit
# linux/amd64 + linux/arm64 (Debian trixie, Python 3.12) und zeigt aktuell auf
# denselben Digest wie der Tag 2.1.9.
#
# Bewusst gepinnt statt :latest. Ein Add-on-Rebuild passiert nur beim Hochzaehlen
# der Version - mit :latest bekaeme man dabei jedes Mal eine unbekannte
# LedFx-Version, inklusive Regressionen. 2.1.9 ist die Version, gegen die dieses
# Add-on geprueft ist (und die erste mit eingebautem Sendspin-Client).
# Aktualisieren: Tag hier hochzaehlen UND version in config.yaml erhoehen.
# Tags tragen kein "v"-Praefix. Spiegel mit Docker-Hub-Pull-Limits: ledfxorg/ledfx
build_from:
  aarch64: ghcr.io/ledfx/ledfx:2.1.9
  amd64: ghcr.io/ledfx/ledfx:2.1.9

labels:
  org.opencontainers.image.title: "LedFx Home Assistant Add-on"
  org.opencontainers.image.description: "Audio-reactive LED-Steuerung fuer WLED & Co."
  org.opencontainers.image.source: "https://github.com/DEIN-GITHUB-USER/ha-ledfx-addon"
  org.opencontainers.image.licenses: "MIT"

args: {}
