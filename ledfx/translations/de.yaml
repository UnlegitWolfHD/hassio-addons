---
configuration:
  host:
    name: Adresse der Web-UI
    description: >-
      Interface, auf dem die Web-UI lauscht. 0.0.0.0 bedeutet alle.
  port:
    name: Port der Web-UI
    description: >-
      Standard 8888. Nur aendern, wenn der Port auf dem Host belegt ist.
  log_level:
    name: Protokollstufe
    description: >-
      info fuer den Normalbetrieb, debug und trace nur zur Fehlersuche.
  audio_source:
    name: Aufnahmequelle (Override)
    description: >-
      Name der PulseAudio-Quelle, meist eine *.monitor-Quelle. Leer lassen und
      stattdessen das Audio-Dropdown von Home Assistant benutzen.
  null_sink:
    name: Virtuelles Audio-Ziel erzwingen
    description: >-
      Nur fuer Snapcast, Squeezelite oder Line-In noetig: legt ein Sink 'l
      edfx' an und macht es zum Standard-Ausgang fuer ALLE Add-ons. Fuer d
      ie Verbindung mit Music Assistant nicht erforderlich.
  sendspin:
    name: Mit Music Assistant verbinden
    description: >-
      Traegt den Sendspin-Server von Music Assistant in die LedFx-Konfigur
      ation ein. LedFx verbindet sich dann selbst damit - ohne Umweg ueber
      PulseAudio. Benoetigt sendspin_server.
  sendspin_server:
    name: Sendspin-Adresse von Music Assistant
    description: >-
      WebSocket-Adresse des Music-Assistant-Servers, z. B.
      ws://192.168.1.50:8927/sendspin
  sendspin_name:
    name: Client-Name
    description: >-
      Unter diesem Namen meldet sich LedFx bei Music Assistant an.
  offline_mode:
    name: Offline-Modus
    description: >-
      Startet LedFx mit --offline - keine Update-Pruefung, kein Crash-Reporting.
network:
  8888/tcp: Web-UI von LedFx
  8927/tcp: Sendspin-Client (nur bei aktivem Sendspin belegt)
