---
configuration:
  host:
    name: Web UI address
    description: >-
      Interface the web UI listens on. 0.0.0.0 means all of them.
  port:
    name: Web UI port
    description: >-
      Defaults to 8888. Only change it when that port is taken on the host.
  log_level:
    name: Log level
    description: >-
      Use info for normal operation; debug and trace are for troubleshooting.
  audio_source:
    name: Capture source (override)
    description: >-
      Name of the PulseAudio source, usually a *.monitor one. Leave empty and
      use the Home Assistant audio dropdown instead.
  null_sink:
    name: Force a virtual audio target
    description: >-
      Only needed for Snapcast, Squeezelite or line-in: creates a sink nam
      ed 'ledfx' and makes it the default output for ALL add-ons. Not requ
      ired for the Music Assistant connection.
  sendspin:
    name: Connect to Music Assistant
    description: >-
      Registers the Music Assistant Sendspin server in the LedFx configura
      tion. LedFx then connects to it directly, with no PulseAudio detour.
      Requires sendspin_server.
  sendspin_server:
    name: Music Assistant Sendspin address
    description: >-
      WebSocket address of the Music Assistant server, e.g.
      ws://192.168.1.50:8927/sendspin
  sendspin_name:
    name: Client name
    description: >-
      The name LedFx registers under in Music Assistant.
  offline_mode:
    name: Offline mode
    description: >-
      Runs LedFx with --offline - no update checks, no crash reporting.
network:
  8888/tcp: LedFx web interface
  8927/tcp: Sendspin client (only in use when Sendspin is enabled)
